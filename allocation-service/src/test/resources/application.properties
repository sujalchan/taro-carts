spring.application.name=allocation-service-test

spring.datasource.url=jdbc:sqlite:target/allocation-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

spring.jpa.open-in-view=false

customer.service.url=http://localhost:8081
taro.service.url=http://localhost:8083
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8084
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8084/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=taro-api
auth.token-uri=http://localhost:8084/oauth2/token
auth.service-client-secret=test-only-service-secret
