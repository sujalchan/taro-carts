spring.application.name=allocation-service-test

spring.datasource.url=jdbc:sqlite:target/allocation-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

spring.jpa.open-in-view=false

spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=1s

customer.service.url=http://localhost:8081
taro.service.url=http://localhost:8083
dispatcher.service.url=http://localhost:8084
allocation.reference.customer-secret=test-customer-reference-secret-0123456789abcdef0123456789abcdef
allocation.reference.dispatcher-secret=test-dispatcher-reference-secret-0123456789abcdef0123456789abcdef
allocation.reference.taro-secret=test-taro-reference-secret-0123456789abcdef0123456789abcdef
spring.profiles.active=legacy-tests
