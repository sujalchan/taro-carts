<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Edit Weekly Allocation</title>
    <script defer src="/js/service-navigation.js"></script>
</head>

<body class="page-form page-allocation">

    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/allocations">Taro Allocation System</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="http://localhost:8081/customers">Customer Service</a>
            <a href="http://localhost:8083/taro-types">Taro Service</a>
            <a href="/allocations" aria-current="page">Allocation Service</a>
        </div>
    </nav>

    <h1>Edit Weekly Allocation</h1>

    <div id="errorContainer" class="error-message" role="alert" hidden>
        <strong>Unable to update allocation:</strong>
        <ul id="errorList"></ul>
    </div>

    <form id="allocationForm">

        <div>
            <label for="customerId">Customer</label>

            <select id="customerId" required>
                <option value="">Select Customer</option>
            </select>
        </div>

        <br>

        <div>
            <label for="weekStart">Week</label>

            <input type="date" id="weekStart" required>

            <small>
                Any date in the week may be selected.
                It will be stored as the Monday of that week.
            </small>
        </div>

        <hr>

        <h2>Allocation Items</h2>

        <div id="allocationItems"></div>

        <button type="button" id="addItemButton">
            Add Another Taro Type
        </button>

        <br>
        <br>

        <button type="submit">
            Save Changes
        </button>

        <a href="/allocations-client.html">
            Cancel
        </a>

    </form>

    <script src="/js/allocation-edit-client.js"></script>

</body>

</html>
