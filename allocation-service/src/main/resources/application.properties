spring.application.name=allocation-service

server.port=8082

# sqlite database
spring.datasource.url=jdbc:sqlite:allocation.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Bound calls to customer-service and taro-service so a failed dependency cannot
# leave allocation requests waiting indefinitely.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:5s}

# customer service
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}


# taro service
taro.service.url=${TARO_SERVICE_URL:http://localhost:8083}

# dispatcher service
dispatcher.service.url=${DISPATCHER_SERVICE_URL:http://localhost:8084}

# Supplier details printed on newly issued invoice PDFs. The PDF remains marked as an example.
invoice.supplier.name=${INVOICE_SUPPLIER_NAME:Taro Carts}
invoice.supplier.address=${INVOICE_SUPPLIER_ADDRESS:}
invoice.supplier.gst-number=${INVOICE_SUPPLIER_GST_NUMBER:}
