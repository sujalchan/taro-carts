spring.application.name=allocation-service

server.port=8082

# sqlite database
spring.datasource.url=jdbc:sqlite:allocation.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Semicolon-separated sample starting addresses. Replace with your own dispatch areas.
delivery.start-addresses=${DELIVERY_START_ADDRESSES:8 Queen Street, Auckland CBD, Auckland;16 Putney Way, Manukau, Auckland;216 Puhinui Road, Papatoetoe, Auckland;3058 Great North Road, New Lynn, Auckland}

# Bound calls to customer-service and taro-service so a failed dependency cannot
# leave allocation requests waiting indefinitely.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:5s}

# customer service
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}


# taro service
taro.service.url=${TARO_SERVICE_URL:http://localhost:8083}

# dispatcher service
dispatcher.service.url=${DISPATCHER_SERVICE_URL:http://localhost:8084}
allocation.reference.customer-secret=${ALLOCATION_CUSTOMER_REFERENCE_SECRET:}
allocation.reference.dispatcher-secret=${ALLOCATION_DISPATCHER_REFERENCE_SECRET:}
allocation.reference.taro-secret=${ALLOCATION_TARO_REFERENCE_SECRET:}

# Supplier details printed on newly issued invoice PDFs. The PDF remains marked as an example.
invoice.supplier.name=${INVOICE_SUPPLIER_NAME:Taro Carts}
invoice.supplier.address=${INVOICE_SUPPLIER_ADDRESS:}
invoice.supplier.gst-number=${INVOICE_SUPPLIER_GST_NUMBER:}
service.auth.login-url=${LOGIN_SERVICE_URL:http://localhost:8085}
service.auth.validation-secret=${LOGIN_ALLOCATION_VALIDATION_SECRET:}
service.auth.connect-timeout=${LOGIN_VALIDATION_CONNECT_TIMEOUT:PT2S}
service.auth.read-timeout=${LOGIN_VALIDATION_READ_TIMEOUT:PT3S}
service.auth.cookie-secure=${LOGIN_COOKIE_SECURE:false}
allocation.assertion.customer-secret=${ALLOCATION_CUSTOMER_ASSERTION_SECRET:}
allocation.assertion.dispatcher-secret=${ALLOCATION_DISPATCHER_ASSERTION_SECRET:}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
