spring.application.name=allocation-service
spring.profiles.default=local

server.port=8082
server.servlet.session.cookie.name=TARO_ALLOCATION_SESSION

# sqlite database
spring.datasource.url=jdbc:sqlite:allocation.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8084}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_ISSUER:http://localhost:8084}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=taro-api
auth.service-client-secret=${AUTH_SERVICE_CLIENT_SECRET:}
auth.token-uri=${AUTH_ISSUER:http://localhost:8084}/oauth2/token

# customer service
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}


# taro service
taro.service.url=${TARO_SERVICE_URL:http://localhost:8083}
