spring.application.name=login-service
server.port=8085
spring.thymeleaf.cache=false

# Browser-only Places configuration; address checks are performed by the registration UI.
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}

# SQLite keeps accounts, registration progress, and hashed session records between restarts.
spring.datasource.url=${LOGIN_DATABASE_URL:jdbc:sqlite:login.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Local HTTP development only; set LOGIN_COOKIE_SECURE=true behind HTTPS.
login.cookie.secure=${LOGIN_COOKIE_SECURE:false}
login.session.lifetime=${LOGIN_SESSION_LIFETIME:PT8H}

# Private customer/dispatcher write calls used during provisioning and activation.
login.customer-service-url=${LOGIN_CUSTOMER_SERVICE_URL:http://localhost:8081}
login.dispatcher-service-url=${LOGIN_DISPATCHER_SERVICE_URL:http://localhost:8084}
login.customer-provisioning-secret=${LOGIN_CUSTOMER_PROVISIONING_SECRET:}
login.dispatcher-provisioning-secret=${LOGIN_DISPATCHER_PROVISIONING_SECRET:}
login.provisioning.connect-timeout=${LOGIN_PROVISIONING_CONNECT_TIMEOUT:PT2S}
login.provisioning.read-timeout=${LOGIN_PROVISIONING_READ_TIMEOUT:PT3S}

# Four distinct credentials authorize loopback session validation requests from backend services.
login.validation.customer-secret=${LOGIN_CUSTOMER_VALIDATION_SECRET:}
login.validation.dispatcher-secret=${LOGIN_DISPATCHER_VALIDATION_SECRET:}
login.validation.allocation-secret=${LOGIN_ALLOCATION_VALIDATION_SECRET:}
login.validation.taro-secret=${LOGIN_TARO_VALIDATION_SECRET:}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
