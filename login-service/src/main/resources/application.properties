spring.application.name=login-service
server.port=8085
spring.thymeleaf.cache=false
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}

# Registration requests are persisted before a receipt is shown.
spring.datasource.url=${LOGIN_DATABASE_URL:jdbc:sqlite:login.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
