<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Request received · Taro Carts</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
<div class="page-shell">
    <header class="site-header">
        <a class="brand" th:href="@{/login}" href="/login" aria-label="Taro Carts home">
            <span class="brand-mark" aria-hidden="true">T</span>
            <span>Taro Carts</span>
        </a>
    </header>

    <main class="receipt-panel" aria-labelledby="receipt-title">
        <div class="receipt-icon" aria-hidden="true">✓</div>
        <span class="eyebrow">Account request</span>
        <h1 id="receipt-title">Your request was received.</h1>
        <p>We saved your account request. An administrator will need to review it before you can sign in.</p>
        <p class="receipt-reference">Reference number <strong th:text="${requestId}">123</strong></p>
        <a class="receipt-link" th:href="@{/login}" href="/login">Back to sign in <span aria-hidden="true">→</span></a>
    </main>

    <footer class="site-footer"><span>© Taro Carts</span></footer>
</div>
</body>
</html>
