<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Log in | Taro Carts</title>
</head>
<body>
    <main class="auth-card">
        <a class="brand" href="/login">Taro Carts</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <p class="intro">Enter your details to continue.</p>

        <div class="notice notice--success" role="status" th:if="${success != null}" th:text="${success}"></div>
        <div class="notice notice--error" role="alert" th:if="${errors != null && !errors.isEmpty()}">
            <strong>Please check your details:</strong>
            <ul><li th:each="error : ${errors}" th:text="${error}">Validation error</li></ul>
        </div>

        <form action="/login" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required th:value="${email}">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>
        <p class="switch">New to Taro Carts? <a href="/register">Create an account</a></p>
        <p class="stub-note">This service currently confirms receipt only. Authentication is not enabled.</p>
    </main>
</body>
</html>
