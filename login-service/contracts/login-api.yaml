openapi: 3.0.3

info:
  title: Login Service API
  version: 1.0.0
  description: >
    Receipt-only login and registration endpoints. Requests are validated and
    acknowledged but are not authenticated, persisted, or used to create accounts.

servers:
  - url: http://localhost:8084
    description: Local development server

paths:
  /api/v1/auth/login:
    post:
      summary: Submit login form information
      operationId: submitLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: customer@example.com
              password: example-password
      responses:
        "202":
          description: Login form information was received; authentication is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
              example:
                message: Login form information was successfully received. Authentication is not enabled yet.
        "400":
          description: Login form information is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: VALIDATION_ERROR
                message: Email is required
                path: /api/v1/auth/login

  /api/v1/auth/register:
    post:
      summary: Submit registration form information
      operationId: submitRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: aroha@example.com
              accountType: CUSTOMER
              businessName: Aroha Taro Ltd
              contactName: Aroha
              phone: "+64211234567"
              password: example-password
      responses:
        "202":
          description: Registration form information was received; no account was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
              example:
                message: Registration form information was successfully received. Account creation is not enabled yet.
        "400":
          description: Registration form information is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: VALIDATION_ERROR
                message: Account type is required
                path: /api/v1/auth/register

components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: example-password
    RegisterRequest:
      type: object
      required: [email, accountType, password]
      properties:
        name:
          type: string
          maxLength: 100
          description: Required for DISPATCHER and ADMIN accounts.
          example: Aroha
        email:
          type: string
          format: email
          maxLength: 254
          example: aroha@example.com
        accountType:
          type: string
          enum: [CUSTOMER, DISPATCHER, ADMIN]
          example: CUSTOMER
        businessName:
          type: string
          description: Required when accountType is CUSTOMER; follows the customer service business name field.
          example: Aroha Taro Ltd
        contactName:
          type: string
          description: Optional contact name for a CUSTOMER account.
          example: Aroha
        phone:
          type: string
          description: Optional customer phone number containing 7 to 15 digits, optionally starting with +.
          pattern: '^\+?[0-9]{7,15}$'
          example: "+64211234567"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: example-password
    SubmissionResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Form information was successfully received.
    ApiError:
      type: object
      required: [code, message, path]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Email is required
        path:
          type: string
          example: /api/v1/auth/login
