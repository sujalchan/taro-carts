<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Taro Types</title>
</head>

<body class="page-list">

    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/customers">Taro Allocation System</a>
        <div class="app-nav__links">
            <a href="/customers" aria-current="page">Customer Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>

    <h1>Taro Types (Server-rendered)</h1>

    <p>
        <a href="/taro-types-client.html">
            Client-rendered taro types page
        </a>
    </p>

    <form action="/taro-types" method="get" class="search-form">
        <div class="search-box">
            <input type="search" id="search" name="search" th:value="${search}" placeholder="Search Taro Types">

            <button type="submit">
                Search
            </button>

            <a href="/taro-types" class="search-clear">
                Clear
            </a>
        </div>
    </form>

    <p>
        <a class="button-primary" href="/taro-types/new">
            Add Taro Type
        </a>
    </p>

    <p th:if="${#lists.isEmpty(taroTypes)}">
        No taro types found.
    </p>

    <div class="table-scroll" role="region" aria-label="Data table" tabindex="0">
        <table th:if="${!#lists.isEmpty(taroTypes)}" border="1">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Standard Price</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="taroType : ${taroTypes}">

                    <td th:text="${taroType.id}">
                        1
                    </td>

                    <td th:text="${taroType.name}">
                        Name
                    </td>

                    <td th:text="${taroType.description}">
                        Description
                    </td>

                    <td th:text="${'$' + #numbers.formatDecimal(taroType.standardPrice, 1, 2)}">
                        $0.00
                    </td>

                    <td>
                        <a th:href="@{/taro-types/{id}/edit(id=${taroType.id})}">
                            Edit
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>
    </div>

    <p>
        <a href="/customers">
            Customers
        </a>
    </p>

</body>

</html>
