<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Add Customer</title>
    <script defer src="/js/service-navigation.js"></script>
</head>

<body class="page-form">

    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/customers">Taro Allocation System</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="/customers" aria-current="page">Customer Service</a>
            <a href="http://localhost:8083/taro-types">Taro Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>

    <h1>Add Customer (Server-rendered)</h1>

    <div class="error-message" role="alert" th:if="${errors != null && !errors.isEmpty()}">

        <strong>Unable to create customer:</strong>

        <ul>
            <li th:each="error : ${errors}" th:text="${error}">
                Error message
            </li>
        </ul>

    </div>

    <form action="/customers/new" method="post">

        <div>
            <label for="name">
                Business Name
            </label>

            <input type="text" id="name" name="name" th:value="${name}" required>
        </div>

        <br>

        <div>
            <label for="contactName">
                Contact Name
            </label>

            <input type="text" id="contactName" name="contactName" th:value="${contactName}">
        </div>

        <br>

        <div>
            <label for="phone">
                Phone
            </label>

            <input type="text" id="phone" name="phone" th:value="${phone}">
        </div>

        <br>

        <div>
            <label for="active">
                Active
            </label>

            <input type="checkbox" id="active" name="active" value="true" th:checked="${active}">
        </div>

        <br>

        <button type="submit">
            Create Customer
        </button>

        <a href="/customers">
            Cancel
        </a>

    </form>

</body>

</html>
