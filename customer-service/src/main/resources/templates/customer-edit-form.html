<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Edit Customer</title>
    <script defer src="/js/service-navigation.js"></script>
</head>

<body class="page-form">

    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/customers">Taro Carts</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="/customers" aria-current="page">Customer Service</a>
            <a href="http://localhost:8084/dispatchers">Dispatcher Service</a>
            <a href="http://localhost:8083/taro-types">Taro Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>

    <h1>Edit Customer (Server-rendered)</h1>

    <div class="error-message" role="alert" th:if="${errors != null && !errors.isEmpty()}">

        <strong>Unable to update customer:</strong>

        <ul>
            <li th:each="error : ${errors}" th:text="${error}">
                Error message
            </li>
        </ul>

    </div>

    <form th:action="@{/customers/{id}/edit(id=${customerId})}" method="post" autocomplete="off">
        <input type="hidden" name="csrf" th:value="${csrfToken}">

        <div>
            <label for="name">
                Business Name
            </label>

            <input type="text" id="name" name="name" th:value="${name}" required>
        </div>

        <br>
        <div>
            <label for="address">Address</label>
            <div class="address-field">
                <input type="text" id="address" name="address" maxlength="500" required
                       th:value="${address}" placeholder="Search and select a New Zealand address"
                       autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="addressSuggestions"
                       aria-expanded="false">
                <div id="addressAutocomplete" class="address-suggestions" hidden>
                    <div id="addressSuggestions" role="listbox" aria-label="Suggested addresses"></div>
                    <div class="address-attribution"><img src="/images/google-maps-logo.svg" alt="Google Maps"></div>
                </div>
            </div>
            <p id="addressAutocompleteStatus" class="form-hint" role="status" aria-live="polite"></p>
        </div>

        <br>

        <div>
            <label for="contactName">
                Contact Name
            </label>

            <input type="text" id="contactName" name="contactName" th:value="${contactName}">
        </div>

        <br>

        <div>
            <label for="phone">
                Phone
            </label>

            <input type="text" id="phone" name="phone" th:value="${phone}">
        </div>

        <br>

        <button type="submit">
            Update Customer
        </button>

        <a href="/customers">
            Cancel
        </a>

    </form>

    <script src="/js/address-autocomplete.js"></script>

</body>

</html>
