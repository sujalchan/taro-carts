spring.application.name=customer-service

server.port=8081

# sqlite database
spring.datasource.url=jdbc:sqlite:customer.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Restricted browser key for Maps JavaScript API and Places API (New).
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}
# Server key restricted to the Address Validation API.
google.maps.server-api-key=${GOOGLE_MAPS_SERVER_API_KEY:}
