spring.application.name=customer-service

server.port=8081

# sqlite database
spring.datasource.url=jdbc:sqlite:customer.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
customer.internal.provisioning-secret=${LOGIN_CUSTOMER_PROVISIONING_SECRET:}

# Restricted browser key for Maps JavaScript API and Places API (New).
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}
service.auth.login-url=${LOGIN_SERVICE_URL:http://localhost:8085}
service.auth.validation-secret=${LOGIN_CUSTOMER_VALIDATION_SECRET:}
service.auth.connect-timeout=${LOGIN_VALIDATION_CONNECT_TIMEOUT:PT2S}
service.auth.read-timeout=${LOGIN_VALIDATION_READ_TIMEOUT:PT3S}
service.auth.cookie-secure=${LOGIN_COOKIE_SECURE:false}
service.auth.reference-secret=${ALLOCATION_CUSTOMER_REFERENCE_SECRET:}
allocation.assertion.secret=${ALLOCATION_CUSTOMER_ASSERTION_SECRET:}
allocation.service.url=${ALLOCATION_SERVICE_URL:http://localhost:8082}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
