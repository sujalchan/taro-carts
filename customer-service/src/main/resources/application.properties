spring.application.name=customer-service

server.port=8081
server.servlet.session.cookie.name=TARO_CUSTOMER_SESSION

# sqlite database
spring.datasource.url=jdbc:sqlite:customer.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8084}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_ISSUER:http://localhost:8084}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=taro-api
