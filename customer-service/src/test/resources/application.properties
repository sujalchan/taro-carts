spring.application.name=customer-service-test

# sqlite test database
spring.datasource.url=jdbc:sqlite:target/customer-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

# disable hibernate sql output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jpa.open-in-view=false
customer.internal.provisioning-secret=test-customer-secret-0123456789abcdef0123456789abcdef
spring.profiles.active=legacy-tests
