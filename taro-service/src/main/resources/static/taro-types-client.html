<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title>Taro Types</title>
    <script defer src="/js/service-navigation.js"></script>
</head>

<body class="page-list">

    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="http://localhost:8081/customers">Taro Allocation System</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="http://localhost:8081/customers">Customer Service</a>
            <a href="/taro-types" aria-current="page">Taro Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>

    <h1>Taro Types (JSON API)</h1>

    <p>
        <a href="/taro-types">
            Server-rendered taro types page
        </a>
    </p>

    <form id="searchForm" class="search-form">
        <div class="search-box">
            <input type="search" id="search" placeholder="Search Taro Types">

            <button type="submit">
                Search
            </button>

            <button type="button" id="clearSearch">
                Clear
            </button>
        </div>
    </form>

    <p>
        <a class="button-primary" href="/taro-type-new-client.html">
            Add Taro Type
        </a>
    </p>

    <p id="status" role="status" aria-live="polite">
        Loading taro types...
    </p>

    <div class="table-scroll" role="region" aria-label="Data table" tabindex="0">
        <table id="taroTypeTable" border="1" hidden>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Standard Price</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="taroTypeTableBody">
            </tbody>

        </table>
    </div>

    <p>
        <a href="http://localhost:8081/customers-client.html">
            Customers
        </a>
    </p>

    <script src="js/taro-types-client.js"></script>
</body>

</html>
