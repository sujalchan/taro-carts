spring.application.name=taro-service

server.port=8083

# sqlite database
spring.datasource.url=jdbc:sqlite:taro.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# jpa / hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# useful during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
service.auth.login-url=${LOGIN_SERVICE_URL:http://localhost:8085}
service.auth.validation-secret=${LOGIN_TARO_VALIDATION_SECRET:}
service.auth.connect-timeout=${LOGIN_VALIDATION_CONNECT_TIMEOUT:PT2S}
service.auth.read-timeout=${LOGIN_VALIDATION_READ_TIMEOUT:PT3S}
service.auth.cookie-secure=${LOGIN_COOKIE_SECURE:false}
service.auth.reference-secret=${ALLOCATION_TARO_REFERENCE_SECRET:}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
