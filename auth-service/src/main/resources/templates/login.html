<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Taro Allocation System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="page-login">
    <main class="login-card">
        <p class="eyebrow">Taro Allocation System</p>
        <h1>Sign in</h1>
        <p class="login-intro">Use your account to continue.</p>

        <div class="error-message" role="alert" th:if="${param.error}">
            The username or password was not recognised. Please try again.
        </div>
        <div class="success-message" role="status" th:if="${param.logout}">
            You have signed out.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
