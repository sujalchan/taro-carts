spring.application.name=auth-service
spring.profiles.default=local
server.port=8084
server.servlet.session.cookie.name=TARO_AUTH_SESSION
spring.datasource.url=jdbc:sqlite:auth.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
auth.issuer=${AUTH_ISSUER:http://localhost:8084}
auth.signing-key-path=${AUTH_SIGNING_KEY_PATH:signing-key.pk8}
auth.admin.username=${AUTH_ADMIN_USERNAME:admin}
auth.admin.password=${AUTH_ADMIN_PASSWORD:}
auth.service-client-secret=${AUTH_SERVICE_CLIENT_SECRET:}
