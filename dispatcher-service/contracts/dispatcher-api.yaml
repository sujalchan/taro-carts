openapi: 3.0.3

info:
  title: Dispatcher Service API
  version: 1.0.0
  description: Create, retrieve, and search dispatcher profiles.

servers:
  - url: http://localhost:8084
    description: Local development server

paths:
  /api/v1/dispatchers:
    get:
      summary: List dispatchers, optionally filtered by search text
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Dispatcher list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DispatcherResponse"
    post:
      summary: Create a dispatcher profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatcherRequest"
            example:
              name: Auckland Dispatch
              contactName: Hana
              phone: "+64211234567"
              address: 20 Example Road, Auckland
      responses:
        "201":
          description: Dispatcher created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatcherResponse"
        "400":
          description: Invalid dispatcher data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Dispatcher name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/dispatchers/{id}:
    get:
      summary: Retrieve a dispatcher by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Dispatcher retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatcherResponse"
        "404":
          description: Dispatcher not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    DispatcherRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          maxLength: 100
        contactName:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
        address:
          type: string
          maxLength: 500
    DispatcherResponse:
      allOf:
        - $ref: "#/components/schemas/DispatcherRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    ApiError:
      type: object
      required: [code, message, path]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
