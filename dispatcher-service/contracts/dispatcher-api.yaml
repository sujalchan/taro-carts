openapi: 3.0.3

info:
  title: Dispatcher Service API
  version: 1.0.0
  description: >-
    REST API for listing, searching, and updating dispatcher profiles,
    plus the browser configuration used by Google Places address suggestions.
    Only login-service can create or activate profiles through private endpoints.

servers:
  - url: http://localhost:8084
    description: Local development server

tags:
  - name: Dispatchers
    description: Dispatcher profile operations
  - name: Google Places Configuration
    description: Public browser configuration for dispatcher address forms

paths:
  /api/v1/mobile/portal/deliveries:
    get:
      summary: List the signed-in dispatcher's assigned deliveries
      description: A delivered allocation has a null deliveryAddress for dispatcher accounts. Administrators use the browser portal to select a dispatcher and retain the address.
      responses:
        '200':
          description: Assigned deliveries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AssignedDelivery'}
        '403': {description: A dispatcher account is required}
  /portal/deliveries/{id}/locations:
    get:
      summary: View the three-point delivery navigation map
      description: Assigned dispatchers may view the map while awaiting dispatch or in transit. Administrators may view it while in transit for the selected dispatcher. The middle truck is an estimated route midpoint when no driver position is stored.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: dispatcherId, in: query, required: false, schema: {type: integer, format: int64}, description: Required for administrators}
        - {name: embedded, in: query, required: false, schema: {type: boolean}, description: Hides browser navigation for the Android in-app map}
      responses:
        '200': {description: Delivery map page, content: {text/html: {schema: {type: string}}}}
        '403': {description: Allocation is not assigned to this dispatcher}
        '404': {description: Delivery is no longer navigable}
  /api/v1/mobile/portal/deliveries/{id}/locations:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      summary: List saved locations for the signed-in driver's allocation
      responses:
        '200':
          description: Last saved driver position, or an empty list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DeliveryLocation'}
        '403': {description: Driver is not assigned to this allocation}
    post:
      summary: Save a foreground delivery location for the signed-in driver
      description: Coordinates come from Android's existing foreground device location API. The single driver position can be refreshed while in transit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryLocationRequest'}
      responses:
        '200':
          description: Saved point with server timestamp
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryLocation'}
        '403': {description: Driver is not assigned to this allocation}
        '409': {description: Delivery is not in transit}
  /api/v1/dispatchers:
    get:
      tags: [Dispatchers]
      summary: List dispatchers
      description: >-
        Returns active and inactive dispatchers. When search is supplied,
        matches a case-insensitive substring in the name, contact name, phone,
        or address. Search does not filter on active state.
      operationId: getAllDispatchers
      parameters:
        - name: search
          in: query
          required: false
          description: Optional substring to search across dispatcher details.
          schema:
            type: string
          example: Auckland
      responses:
        "200":
          description: Dispatcher list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DispatcherResponse"
              example:
                - id: 1
                  name: Auckland Dispatch
                  contactName: Hana
                  phone: "+64211234567"
                  address: 20 Example Road, Auckland
                  active: true

  /api/v1/dispatchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Dispatcher ID.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 1
    get:
      tags: [Dispatchers]
      summary: Retrieve a dispatcher by ID
      operationId: getDispatcherById
      responses:
        "200":
          description: Dispatcher retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatcherResponse"
              example:
                id: 1
                name: Auckland Dispatch
                contactName: Hana
                phone: "+64211234567"
                address: 20 Example Road, Auckland
                active: true
        "404":
          description: No dispatcher exists with this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: DISPATCHER_NOT_FOUND
                message: Dispatcher with ID 999 was not found.
                path: /api/v1/dispatchers/999

    put:
      tags: [Dispatchers]
      summary: Update a dispatcher
      description: >-
        Updates the required name and address. Omitted contactName or phone
        values are cleared. Active status cannot be changed through this API.
        Browser forms require changed addresses to be selected from Google
        Places; the REST API only requires a nonblank address. Names are unique
        after lowercasing and removing whitespace.
      operationId: updateDispatcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatcherRequest"
            example:
              name: Auckland Dispatch
              contactName: Hana
              phone: "+64211234567"
              address: 20 Example Road, Auckland
      responses:
        "200":
          description: Dispatcher updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatcherResponse"
              example:
                id: 1
                name: Auckland Dispatch
                contactName: Hana
                phone: "+64211234567"
                address: 20 Example Road, Auckland
                active: false
        "400":
          description: Request validation failed, including missing required fields or an invalid phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: VALIDATION_ERROR
                message: Dispatcher address is required
                path: /api/v1/dispatchers/1
        "404":
          description: No dispatcher exists with this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another dispatcher with the same normalized name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: DISPATCHER_ALREADY_EXISTS
                message: Dispatcher 'Auckland Dispatch' already exists.
                path: /api/v1/dispatchers/2

  /api/v1/google-places/config:
    get:
      tags: [Google Places Configuration]
      summary: Get Google Places browser configuration
      description: >-
        Returns the browser API key used by address autocomplete. The key is an
        empty string when it is not configured. This endpoint does not validate
        addresses.
      operationId: getGooglePlacesConfig
      responses:
        "200":
          description: Google Places browser configuration returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GooglePlacesConfigResponse"
              example:
                apiKey: browser-api-key

components:
  schemas:
    AssignedDelivery:
      type: object
      properties:
        id: {type: integer, format: int64}
        deliveryStatus: {type: string}
        deliveryAddress: {type: string, nullable: true, description: Null after delivery for dispatcher accounts}
        dispatchStartAddress: {type: string, nullable: true}
    DeliveryLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    DeliveryLocation:
      type: object
      properties:
        kind: {type: string, enum: [DRIVER]}
        latitude: {type: number}
        longitude: {type: number}
        updatedAt: {type: string, format: date-time}
    DispatcherRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: Required dispatcher name. Names are unique after lowercasing and removing whitespace.
          example: Auckland Dispatch
        contactName:
          type: string
          nullable: true
          maxLength: 100
          description: Optional contact person's name. A blank value is stored as null.
          example: Hana
        phone:
          type: string
          nullable: true
          pattern: '^$|^\+?[0-9]{7,15}$'
          description: Optional phone number with 7 to 15 digits, optionally prefixed by +. A blank value is stored as null.
          example: "+64211234567"
        address:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: >-
            Required nonblank address. Browser forms require a complete New
            Zealand street address selected from Google Places; direct API
            requests are not Google-validated.
          example: 20 Example Road, Auckland
    DispatcherResponse:
      type: object
      required: [id, name, address, active]
      properties:
        id:
          type: integer
          format: int64
          description: Dispatcher ID.
          example: 1
        name:
          type: string
          maxLength: 100
          description: Dispatcher name.
          example: Auckland Dispatch
        contactName:
          type: string
          nullable: true
          maxLength: 100
          description: Contact person's name, if provided.
          example: Hana
        phone:
          type: string
          nullable: true
          pattern: '^$|^\+?[0-9]{7,15}$'
          description: Phone number, if provided.
          example: "+64211234567"
        address:
          type: string
          maxLength: 500
          description: Saved address.
          example: 20 Example Road, Auckland
        active:
          type: boolean
          description: Inactive dispatchers remain included in list and search results.
          example: true

    GooglePlacesConfigResponse:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          description: Browser API key for Google Places, or an empty string when unset.

    ApiError:
      type: object
      required: [code, message, path]
      properties:
        code:
          type: string
          description: Stable error code.
          example: DISPATCHER_NOT_FOUND
        message:
          type: string
          description: Human-readable error message.
          example: Dispatcher with ID 999 was not found.
        path:
          type: string
          description: Request path that produced the error.
          example: /api/v1/dispatchers/999
