<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery location - Taro Carts</title><link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth-inspired.css"><script defer src="/js/service-navigation.js"></script>
<script defer src="/js/delivery-locations.js"></script></head>
<body class="page-list portal-page" th:classappend="${embedded ? ' embedded-map' : ''}">
<nav class="app-nav" th:unless="${embedded}" aria-label="Portal navigation" th:attr="data-nav-role=${admin ? 'admin' : 'dispatcher'}">
<a class="app-nav__brand" href="/portal/deliveries">Taro Carts</a>
<div class="app-nav__links"><a href="/portal/deliveries">Deliveries</a><a href="http://localhost:8085/logout">Sign out</a></div></nav>
<main><p th:unless="${embedded}"><a th:href="@{/portal/deliveries(dispatcherId=${admin ? dispatcherId : null})}">Back to deliveries</a></p>
<header class="portal-hero" th:unless="${embedded}"><p class="portal-eyebrow" th:text="${admin ? 'Delivery location' : 'Navigation'}">Delivery location</p>
<h1 th:text="|Allocation ${delivery.id} - ${delivery.customerName}|">Delivery location</h1></header>
<section aria-label="Delivery map" class="delivery-map-section">
<h2 th:unless="${embedded}">Map</h2>
<div class="delivery-map-shell">
<div id="deliveryMap" class="delivery-map" role="img" aria-label="Map showing dispatch start, driver locations, and delivery destination"
     th:attr="data-address=${delivery.deliveryAddress},data-start-address=${startAddress}"></div>
<div class="delivery-map-summary" aria-label="Route points">
<div><strong>Starting point</strong><span id="startAreaSummary" th:text="${startAddress ?: 'Choose a dispatch area'}">Starting point</span></div>
<div class="delivery-driver-summary">
<img th:src="${driverPoint == null ? '/images/delivery-driver-illustrative-marker.svg' : '/images/delivery-driver-marker.svg'}" alt="">
<span><strong>Delivery driver</strong><span id="driverPositionSummary"
    th:text="${driverPoint == null ? 'Estimated midpoint (no driver update)' : 'Driver shared ' + driverPoint.updatedAt + ' UTC'}">Middle position</span></span></div>
<div><strong>Delivery address</strong><span th:text="${delivery.deliveryAddress ?: 'Not set'}">Delivery address</span></div>
</div>
<div class="delivery-route-legend" aria-label="Route line key">
<span><i class="route-key-covered" th:classappend="${driverPoint == null ? ' route-key-illustrative' : ''}"></i>
<span th:text="${driverPoint == null ? 'Estimated progress' : 'Estimated covered portion'}">Covered</span></span>
<span><i class="route-key-remaining"></i>Remaining route</span>
</div></div>
<p id="deliveryMapStatus" role="status">Loading map...</p>
</section>
<span class="delivery-point" th:each="kind : ${kinds}" th:with="point=${points[kind]}"
      th:if="${points[kind] != null}" hidden
      th:attr="data-kind=${kind},data-latitude=${point.latitude},data-longitude=${point.longitude},data-updated-at=${point.updatedAt}"></span>
</main></body></html>
