<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/service-navigation.js"></script>
    <script defer src="/js/address-autocomplete.js"></script>
    <title>Create Dispatcher</title>
</head>
<body class="page-form">
    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/dispatchers">Taro Allocation System</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="http://localhost:8081/customers">Customer Service</a>
            <a href="http://localhost:8084/dispatchers" aria-current="page">Dispatcher Service</a>
            <a href="http://localhost:8083/taro-types">Taro Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>
    <h1>Create Dispatcher</h1>
    <p><a href="/dispatcher-new-client.html">Use the client-rendered form</a></p>
    <div class="error-message" role="alert" th:if="${errors != null && !errors.isEmpty()}">
        <strong>Unable to create dispatcher:</strong>
        <ul><li th:each="error : ${errors}" th:text="${error}">Error message</li></ul>
    </div>
    <form action="/dispatchers/new" method="post" autocomplete="off">
        <div>
            <label for="name">Dispatcher Name</label>
            <input type="text" id="name" name="name" maxlength="100" required th:value="${name}">
        </div>
        <div>
            <label for="contactName">Contact</label>
            <input type="text" id="contactName" name="contactName" maxlength="100" th:value="${contactName}">
        </div>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="\+?[0-9]{7,15}"
                   title="Enter 7 to 15 digits, optionally starting with +" th:value="${phone}">
        </div>
        <div>
            <label for="active">Active</label>
            <input type="checkbox" id="active" name="active" value="true" th:checked="${active}">
        </div>
        <div>
            <label for="address">Address</label>
            <div class="address-field">
                <input type="text" id="address" name="address" maxlength="500" required th:value="${address}"
                       placeholder="Search or enter a New Zealand address" autocomplete="off" role="combobox"
                       aria-autocomplete="list" aria-controls="addressSuggestions" aria-expanded="false">
                <div id="addressAutocomplete" class="address-suggestions" hidden>
                    <div id="addressSuggestions" role="listbox" aria-label="Suggested addresses"></div>
                    <div class="address-attribution"><img src="/images/google-maps-logo.svg" alt="Google Maps"></div>
                </div>
            </div>
            <p id="addressAutocompleteStatus" class="form-hint" role="status" aria-live="polite"></p>
        </div>
        <button type="submit">Create Dispatcher</button>
        <a href="/dispatchers">Cancel</a>
    </form>
</body>
</html>
