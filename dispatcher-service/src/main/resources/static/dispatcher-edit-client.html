<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/service-navigation.js"></script>
    <title>Edit Dispatcher</title>
</head>
<body class="page-form">
    <nav class="app-nav" aria-label="Service navigation">
        <a class="app-nav__brand" href="/dispatchers">Taro Allocation System</a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="service-navigation">
            <span aria-hidden="true">☰</span> Menu
        </button>
        <div class="app-nav__links" id="service-navigation">
            <a href="http://localhost:8081/customers">Customer Service</a>
            <a href="http://localhost:8084/dispatchers" aria-current="page">Dispatcher Service</a>
            <a href="http://localhost:8083/taro-types">Taro Service</a>
            <a href="http://localhost:8082/allocations">Allocation Service</a>
        </div>
    </nav>
    <h1>Edit Dispatcher (JSON API)</h1>
    <p><a href="/dispatchers">Server-rendered dispatcher page</a></p>
    <div id="errorContainer" class="error-message" role="alert" hidden>
        <strong>Unable to update dispatcher:</strong>
        <ul id="errorList"></ul>
    </div>
    <form id="dispatcherForm" autocomplete="off">
        <label for="name">Dispatcher Name</label>
        <input type="text" id="name" name="name" maxlength="100" required>

        <label for="contactName">Contact</label>
        <input type="text" id="contactName" name="contactName" maxlength="100">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" pattern="\+?[0-9]{7,15}"
               title="Enter 7 to 15 digits, optionally starting with +">

        <label for="active">Active</label>
        <input type="checkbox" id="active" name="active">

        <label for="address">Address</label>
        <div class="address-field">
            <input type="text" id="address" name="address" maxlength="500" required
                   placeholder="Search or enter a New Zealand address" autocomplete="off"
                   role="combobox" aria-autocomplete="list" aria-controls="addressSuggestions" aria-expanded="false">
            <div id="addressAutocomplete" class="address-suggestions" hidden>
                <div id="addressSuggestions" role="listbox" aria-label="Suggested addresses"></div>
                <div class="address-attribution"><img src="/images/google-maps-logo.svg" alt="Google Maps"></div>
            </div>
        </div>
        <p id="addressAutocompleteStatus" class="form-hint" role="status" aria-live="polite"></p>
        <button type="submit">Update Dispatcher</button>
        <a href="/dispatchers-client.html">Cancel</a>
    </form>
    <script src="/js/dispatcher-edit-client.js"></script>
    <script src="/js/address-autocomplete.js"></script>
</body>
</html>
