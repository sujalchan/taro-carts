spring.application.name=dispatcher-service
server.port=8084

spring.datasource.url=jdbc:sqlite:dispatcher.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
dispatcher.internal.provisioning-secret=${LOGIN_DISPATCHER_PROVISIONING_SECRET:}

google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}
service.auth.login-url=${LOGIN_SERVICE_URL:http://localhost:8085}
service.auth.validation-secret=${LOGIN_DISPATCHER_VALIDATION_SECRET:}
service.auth.connect-timeout=${LOGIN_VALIDATION_CONNECT_TIMEOUT:PT2S}
service.auth.read-timeout=${LOGIN_VALIDATION_READ_TIMEOUT:PT3S}
service.auth.cookie-secure=${LOGIN_COOKIE_SECURE:false}
service.auth.reference-secret=${ALLOCATION_DISPATCHER_REFERENCE_SECRET:}
allocation.assertion.secret=${ALLOCATION_DISPATCHER_ASSERTION_SECRET:}
allocation.service.url=${ALLOCATION_SERVICE_URL:http://localhost:8082}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
